<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{NOM}} — {{EDITEUR}}</title>
<meta name="description" content="{{DESCRIPTION}}">
{{ROBOTS_OBJET}}<link rel="canonical" href="{{CANONIQUE}}">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#F6F3ED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{NOM_COURT}}">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icones/apple-touch-icon.png">
<link rel="icon" href="/icones/icone-192.png" sizes="192x192">
<link rel="preload" href="/commun/polices/ebg-roman.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/commun/commun.css">
<link rel="stylesheet" href="/commun/objet.css">
</head>
<body>
{{BANDEAU_ESSAI}}<section class="ouvert" aria-label="{{NOM}}">
  <div class="barre"><a href="{{SITE_EDITIONS}}">← {{EDITEUR}}</a><button type="button" data-propos>À propos</button></div>
  <div class="h">
    <div class="sphere" data-sphere><img src="/commun/media/b-fixe.jpg" alt=""></div>
    <div class="texte">
      <time class="heure" data-heure></time>
      <div class="phrase" data-phrase aria-live="polite"></div>
      <p class="signature">{{NOM}}</p>
      <div class="liens"><button type="button" data-partager>Partager cet instant</button><button type="button" data-ajouter>Ajouter à mon écran d’accueil</button></div>
    </div>
  </div>
</section>
<dialog id="d-propos" aria-labelledby="t-propos"><button class="fermer" type="button" data-fermer>Fermer</button>
  <h2 id="t-propos">{{NOM}}</h2><p>{{TEXTE_PROPOS}}</p></dialog>
<dialog id="d-sources" aria-labelledby="t-sources"><button class="fermer" type="button" data-fermer>Fermer</button>
  <h2 id="t-sources">Sources</h2><div data-liste-sources></div></dialog>
<script>window.CHRONO_ACTIONS={{ACTIONS_JSON}};</script>
<script src="/commun/moteur.js"></script>
<script src="/commun/carte.js"></script>
<script src="/commun/actions.js"></script>
<script src="/commun/objet.js"></script>
</body>
</html>
